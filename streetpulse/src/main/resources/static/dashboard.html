<!DOCTYPE html>
<html>
<head>
    <title>StreetPulse - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<script src="js/app.js"></script>

<body>

<h2 id="welcome"></h2>

<div id="actions"></div>

<hr>

<button onclick="logout()">Logout</button>

<script>
    const user = JSON.parse(localStorage.getItem("user"));
    console.log("Logged in user:", user);


    if (!user) {
        window.location.href = "login.html";
    }

    document.getElementById("welcome").innerText =
        "Welcome " + user.name + " (" + user.role + ")";

    const actions = document.getElementById("actions");

    // Citizen
    if (user.role === "CITIZEN") {
        actions.innerHTML = `
    <h3>Report an Issue</h3>

    <input id="title" placeholder="Title"><br><br>
    <textarea id="desc" placeholder="Description"></textarea><br><br>

    <input id="lat" placeholder="Latitude"><br><br>
    <input id="lng" placeholder="Longitude"><br><br>
    <input id="addr" placeholder="Address"><br><br>

    <select id="priority">
      <option>LOW</option>
      <option>MEDIUM</option>
      <option>HIGH</option>
      <option>CRITICAL</option>
    </select><br><br>

    <button onclick="submitComplaint()">Submit Complaint</button>
    <p id="msg"></p>
  `;
    }


    // Volunteer or Admin
    // ----- COMMON FOR ALL USERS -----
    actions.innerHTML = `
  <button onclick="loadComplaints()">View Complaints</button>

  <div id="complaints"></div>

  <hr>

  <h3>Upload Image for Complaint</h3>
  <input type="number" id="imgComplaintId" placeholder="Complaint ID"><br><br>
  <input type="file" id="imgFile"><br><br>
  <button onclick="uploadImage()">Upload Image</button>
  <p id="imgMsg"></p>
`;

    // ----- EXTRA FOR VOLUNTEER & ADMIN -----
    if (user.role === "VOLUNTEER" || user.role === "ADMIN") {
        actions.innerHTML = `
    <button onclick="openHeatmap()">View Heatmap</button>
  ` + actions.innerHTML;
    }



</script>

</body>
</html>
