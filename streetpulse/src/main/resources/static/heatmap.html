<!DOCTYPE html>
<html>
<head>
  <title>Issue Heatmap</title>
  <link rel="stylesheet" href="/style.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Leaflet Heat plugin -->
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <style>
    #map {
      height: 90vh;
      width: 100%;
    }
  </style>
</head>
<body>

<h2 style="text-align:center">StreetPulse – Issue Heatmap</h2>
<div id="map"></div>

<script>
  const map = L.map('map').setView([12.9716, 77.5946], 12); // default: Bangalore

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  fetch('/heatmap/data')
          .then(res => res.json())
          .then(data => {
            const points = [];

            data.forEach(c => {
              if (c.latitude && c.longitude) {
                points.push([c.latitude, c.longitude, 0.7]);
              }
            });

            L.heatLayer(points, {
              radius: 25,
              blur: 15,
              maxZoom: 17
            }).addTo(map);
          });
</script>

</body>
</html>
