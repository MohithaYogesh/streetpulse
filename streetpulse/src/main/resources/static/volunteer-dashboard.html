<!DOCTYPE html>
<html>
<head>
    <title>Volunteer Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="page-bg">

<div class="form-box">
    <h2>Volunteer - Open Issues</h2>

    <table border="1" width="100%" id="issueTable">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </table>

    <br>
    <a href="/login.html">Logout</a>
    <a href="/heatmap.html" class="btn">View Heatmap</a>
</div>

<script>
    fetch("/volunteer/issues")
        .then(r => r.json())
        .then(data => {
            let table = document.getElementById("issueTable");

            data.forEach(c => {
                let row = document.createElement("tr");
                row.innerHTML = `
            <td>${c.id}</td>
            <td>${c.title}</td>
            <td>${c.status}</td>
            <td>
              <button onclick="startResolving(${c.id})">
                Start Resolving
              </button>
            </td>
          `;
                table.appendChild(row);
            });
        });

    function startResolving(id) {
        fetch(`/volunteer/issues/${id}/start`, {
            method: "PUT"
        }).then(() => location.reload());
    }
</script>

</body>
</html>
